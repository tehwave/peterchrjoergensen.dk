<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>Quickpay CLI local callback watcher</title>
  <desc>A dark terminal on a textured paper background shows Quickpay CLI forwarding a signed callback to localhost.</desc>
  <metadata>
    Deterministic source artwork created for peterchrjoergensen.dk on 2026-08-10.
    Terminal copy is based on the Quickpay CLI callbacks:watch command and its tested output.
    No credentials, merchant data, or third-party imagery are included.
  </metadata>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="3" seed="14" result="noise" />
      <feColorMatrix in="noise" type="saturate" values="0" result="mono" />
      <feComponentTransfer in="mono" result="faded">
        <feFuncA type="table" tableValues="0 0.1" />
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="multiply" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="170%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#091057" flood-opacity="0.24" />
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3.5" fill="#091057" opacity="0.18" />
    </pattern>
    <linearGradient id="terminal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20263a" />
      <stop offset="1" stop-color="#111522" />
    </linearGradient>
    <linearGradient id="pinkGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4f91" />
      <stop offset="1" stop-color="#fc1154" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#fc1154" />
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#dbd3d3" />
  <rect width="1600" height="900" fill="#dbd3d3" filter="url(#paper)" />
  <path d="M0 674c210-74 382-57 555 48s377 117 563 30c194-91 318-102 482-47v195H0z" fill="#091057" />
  <circle cx="1424" cy="120" r="236" fill="url(#pinkGlow)" opacity="0.96" />
  <path d="M1260-10c139 82 225 173 280 300" fill="none" stroke="#fbfbfb" stroke-width="8" stroke-linecap="round" opacity="0.72" />
  <rect x="42" y="50" width="360" height="210" fill="url(#dots)" transform="rotate(-7 42 50)" />

  <g filter="url(#shadow)" transform="translate(0 -85)">
    <rect x="192" y="300" width="1216" height="470" rx="30" fill="url(#terminal)" stroke="#596276" stroke-width="2" />
    <path d="M192 368h1216" stroke="#3b4256" stroke-width="2" />
    <circle cx="240" cy="334" r="10" fill="#fc1154" />
    <circle cx="274" cy="334" r="10" fill="#ec8305" />
    <circle cx="308" cy="334" r="10" fill="#64d991" />
    <text x="800" y="343" text-anchor="middle" font-family="Menlo, monospace" font-size="19" fill="#97a1b2">quickpay / callbacks:watch</text>

    <g font-family="Menlo, monospace" font-size="23">
      <text x="248" y="425" fill="#fc1154">$</text>
      <text x="278" y="425" fill="#f7f8fa">quickpay callbacks:watch \</text>
      <text x="278" y="463" fill="#f7f8fa">--to=http://127.0.0.1:8000/quickpay/callback</text>

      <text x="248" y="530" fill="#64d991">✓</text>
      <text x="282" y="530" fill="#dbe4f0">Watching all Quickpay payment callbacks.</text>
      <text x="282" y="566" fill="#97a1b2">Press Ctrl-C to stop.</text>

      <text x="248" y="636" fill="#64d991">✓</text>
      <text x="282" y="636" fill="#dbe4f0">Delivered callback for payment 42 operation 1</text>
      <text x="282" y="672" fill="#dbe4f0">with HTTP 204.</text>
    </g>

    <g transform="translate(1006 412)">
      <rect width="328" height="252" rx="22" fill="#151a2a" stroke="#434b61" stroke-width="2" />
      <text x="28" y="45" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="3" fill="#97a1b2">CALLBACK LOOP</text>
      <rect x="28" y="70" width="112" height="44" rx="22" fill="#29304a" />
      <text x="84" y="98" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#f7f8fa">POLL</text>
      <rect x="188" y="70" width="112" height="44" rx="22" fill="#29304a" />
      <text x="244" y="98" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#f7f8fa">SIGN</text>
      <path d="M142 92h42" fill="none" stroke="#fc1154" stroke-width="4" marker-end="url(#arrow)" />
      <path d="M244 120v38c0 18-14 32-32 32h-70" fill="none" stroke="#fc1154" stroke-width="4" marker-end="url(#arrow)" />
      <rect x="28" y="168" width="272" height="54" rx="12" fill="#fc1154" />
      <text x="164" y="201" text-anchor="middle" font-family="Menlo, monospace" font-size="17" font-weight="700" fill="#fbfbfb">127.0.0.1</text>
    </g>
  </g>

  <g transform="translate(1138 653) rotate(-4)">
    <rect width="318" height="82" rx="8" fill="#fc1154" />
    <text x="159" y="52" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="900" letter-spacing="3" fill="#fbfbfb">SIGNED CALLBACKS</text>
  </g>
</svg>
